<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Pixelify+Sans:wght@400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ── Shared design tokens (Lavender Calm) ─────────────── */
  :root {
    --bg: #F6F5FA; --surface: #FBFAFD; --card: #FFFFFF; --border: #ECEAF3;
    --accent: #A89CE6; --accent-deep: #6E62B8; --accent-tint: #EEEBFB; --neutral-tint: #F1F0F6;
    --track: #E7E4F1; --text: #2E2B3A; --muted: #908AA0; --hint: #B6B1C4;
    --check-border: #DAD6E6; --del: #C9C5D6;
    --mint: #9FD8C0; --mint-deep: #4F9E82; --rose: #F0B7C2; --amber: #F2D29C;
  }
  body {
    width: 320px;
    height: 520px;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: 'Nunito', -apple-system, 'Segoe UI', sans-serif;
  }

  #container {
    width: 320px;
    height: 520px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 0;
  }

  /* ── Pop-out panel (frosted glass) ───────────────────── */
  #panel {
    position: absolute;
    bottom: 162px;
    left: 8px;
    width: 268px;
    max-height: 410px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: 0 14px 40px rgba(120, 110, 180, 0.16);
    padding: 16px;
    color: var(--text);
    font-family: 'Nunito', -apple-system, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    gap: 13px;
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    pointer-events: none;
    transition: opacity 0.28s cubic-bezier(.2,.8,.2,1), transform 0.28s cubic-bezier(.2,.8,.2,1);
    z-index: 20;
  }
  #panel.open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .panel-greeting { font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; }
  .panel-status   { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-top: -6px; letter-spacing: -0.1px; }

  /* Clock + break stat cards */
  .badges { display: flex; gap: 9px; }
  .badge {
    flex: 1; text-align: center; padding: 12px 4px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--border);
  }
  .badge .num { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: -0.4px; line-height: 1; font-variant-numeric: tabular-nums; }
  .badge .lbl { font-size: 8.5px; font-weight: 700; color: var(--hint); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 5px; }

  /* Controls */
  .controls { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 12px 6px; border: none; border-radius: 14px;
    font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: transform .12s ease, filter .15s ease;
  }
  .btn:hover { filter: brightness(1.04); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; transform: none; }
  .btn-work, .btn-back {
    background: var(--accent); color: #ffffff;
    box-shadow: 0 5px 14px rgba(120, 110, 180, 0.28);
  }
  .btn-break { background: var(--accent-tint); color: var(--accent-deep); }
  .btn-end   { background: var(--neutral-tint); color: var(--muted); }

  /* End-Work reason prompt */
  #reason-box { display: none; flex-direction: column; gap: 8px;
                background: var(--card); border: 1px solid var(--border);
                border-radius: 16px; padding: 12px; }
  #reason-box.show { display: flex; }
  #reason-box .rt { font-size: 12px; font-weight: 800; color: var(--text); }
  #reason-box input { border: 1px solid var(--border); border-radius: 12px;
                      padding: 9px 11px; font-family: inherit; font-size: 12.5px; font-weight: 600;
                      outline: none; background: var(--surface); color: var(--text); }
  #reason-box input:focus { border-color: var(--accent); }

  /* Today list */
  .today-head { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }

  /* Completion progress — segmented */
  .today-progress { display: flex; flex-direction: column; gap: 6px; }
  .today-progress.empty-prog { display: none; }
  .today-progress .pbar { display: flex; gap: 5px; }
  .today-progress .seg { flex: 1; height: 8px; border-radius: 7px; background: var(--track); }
  .today-progress .seg.done { background: var(--accent); }
  .today-progress .plabel { font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: -0.1px; }

  #today-items { display: flex; flex-direction: column; gap: 7px;
                 overflow-y: auto; max-height: 152px; padding-right: 2px; }
  #today-items::-webkit-scrollbar { width: 5px; }
  #today-items::-webkit-scrollbar-thumb { background: rgba(120,110,180,0.22); border-radius: 3px; }

  .todo {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 10px;
    padding: 11px 11px 11px 16px; border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: -0.1px;
  }
  .todo::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent); }
  .todo.acc-red::before   { background: var(--rose); }
  .todo.acc-amber::before { background: var(--amber); }
  .todo.acc-green::before { background: var(--accent); }
  .todo.done::before { background: var(--mint); }
  .todo .box {
    width: 19px; height: 19px; border-radius: 7px; border: 2px solid var(--check-border);
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 12px; color: #fff;
    background: #fff; transition: all 0.15s;
  }
  .todo.done .box { background: var(--mint); border-color: var(--mint); }
  .todo.done .txt { text-decoration: line-through; color: var(--hint); font-weight: 600; }
  .todo .txt { flex: 1; word-break: break-word; }
  .todo .del { cursor: pointer; color: var(--del); font-size: 17px; line-height: 1; transition: color 0.15s; }
  .todo .del:hover { color: var(--rose); }

  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1; border: 1px solid var(--border); border-radius: 14px;
    padding: 11px 13px; font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--text);
    outline: none; background: var(--card);
  }
  .add-row input::placeholder { color: var(--hint); font-weight: 600; }
  .add-row input:focus { border-color: var(--accent); background: #fff; }
  .add-row button {
    border: none; background: var(--accent); color: #ffffff;
    border-radius: 14px; padding: 0 17px; font-size: 20px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 12px rgba(120,110,180,0.24);
  }
  .empty { font-size: 12.5px; color: var(--hint); text-align: center; padding: 12px; font-weight: 600; }

  /* Panel tail pointing to Mochi */
  #panel::after {
    content: ''; position: absolute; bottom: -9px; left: 42px;
    width: 0; height: 0; border-left: 10px solid transparent;
    border-right: 10px solid transparent; border-top: 10px solid var(--surface);
  }

  /* ── Speech bubble (soft glass, pixel-font charm) ─────── */
  #speech-bubble {
    display: none;
    position: absolute;
    bottom: 158px;
    left: 8px;
    max-width: 232px;
    background: rgba(255, 255, 255, 0.94);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    border-radius: 16px;
    padding: 11px 15px;
    font-family: 'Pixelify Sans', 'Consolas', 'DejaVu Sans Mono', monospace;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    text-align: left;
    box-shadow: 0 10px 28px rgba(120, 110, 180, 0.20), inset 0 1px 0 rgba(255, 255, 255, 0.7);
    z-index: 30;
    word-break: break-word;
  }
  /* soft tail, pointing down to Mochi */
  #speech-bubble::after {
    content: ''; position: absolute; bottom: -8px; left: 28px;
    width: 0; height: 0; border-left: 8px solid transparent;
    border-right: 8px solid transparent; border-top: 9px solid rgba(255, 255, 255, 0.94);
  }
  #speech-bubble.visible { display: block; animation: bubblePop 0.28s cubic-bezier(.2,.8,.2,1); }
  @keyframes bubblePop {
    from { opacity: 0; transform: translateY(6px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Character (Mochi) ───────────────────────────────── */
  /* Portrait box so the (taller-than-wide) bunny isn't squished. */
  #character-wrap {
    position: relative; width: 122px; height: 150px;
    cursor: pointer; flex-shrink: 0; align-self: flex-start; margin-left: 16px;
  }
  #mochi { width: 100%; height: 100%; display: block; }

  /* Custom sprite frames (Pavni's bunny). Hidden until frames are loaded.
     object-fit: contain keeps the original aspect ratio (no stretching). */
  #mochi-img {
    width: 100%; height: 100%; display: none;
    object-fit: contain; object-position: center bottom;
    image-rendering: pixelated; image-rendering: crisp-edges;
    transform-origin: center bottom;
  }
  #character-wrap.has-frames #mochi { display: none; }
  #character-wrap.has-frames #mochi-img { display: block; }

  /* Position animations applied to single-frame sprites for a little life */
  #mochi-img.anim-bounce { animation: bounce 0.8s ease-in-out infinite; }
  #mochi-img.anim-shake  { animation: shake 0.4s linear infinite; }
  #mochi-img.anim-nod    { animation: nod 1.2s ease-in-out infinite; }
  #mochi-img.anim-float  { animation: float 2.5s ease-in-out infinite; }

  @keyframes float  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes shake  { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  @keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:0.8} }
  @keyframes nod    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  @keyframes zzz    { 0%,100%{opacity:0.65} 50%{opacity:1} }

  #mochi.mood-happy       { animation: bounce 0.8s ease-in-out infinite; }
  #mochi.mood-focused     { animation: pulse  2s ease-in-out infinite; }
  #mochi.mood-encouraging { animation: nod    1.2s ease-in-out infinite; }
  #mochi.mood-sad         { filter: brightness(0.82) saturate(0.55); }
  #mochi.mood-angry       { animation: shake  0.4s linear infinite; filter: hue-rotate(340deg) saturate(1.4); }
  #mochi.mood-nagging     { animation: bounce 0.45s ease-in-out infinite; filter: hue-rotate(280deg); }
  #mochi.mood-sleeping    { animation: zzz    2s ease-in-out infinite; filter: grayscale(0.35); }

  #mochi .angry-brows { display: none; }
  #mochi .eyes-closed { display: none; }
  #mochi .mouth-sad   { display: none; }
  #mochi.mood-sleeping .eyes-open   { display: none; }
  #mochi.mood-sleeping .eyes-closed { display: block; }
  #mochi.mood-sad .mouth-smile { display: none; }
  #mochi.mood-sad .mouth-sad   { display: block; }
  #mochi.mood-angry  .angry-brows { display: block; }
  #mochi.mood-nagging .angry-brows { display: block; opacity: 0.65; }

  #task-badge {
    display: none; position: absolute; top: 2px; left: 2px;
    background: #e74c3c; color: white; font-size: 9px; font-weight: bold;
    width: 18px; height: 18px; border-radius: 50%;
    align-items: center; justify-content: center; border: 1.5px solid #fff; z-index: 5;
  }
  #task-badge.visible { display: flex; }

  #distraction-timer {
    display: none; font-size: 10px; color: #fff; background: rgba(231,76,60,0.92);
    border-radius: 10px; padding: 2px 8px; margin-top: 2px; margin-left: 14px;
    letter-spacing: 0.5px; height: 18px; align-items: center; align-self: flex-start;
  }
  #distraction-timer.visible { display: flex; }
</style>
</head>
<body>
<div id="container">

  <!-- Pop-out panel -->
  <div id="panel">
    <div class="panel-greeting" id="greeting">hi pavni 🐰</div>
    <div class="panel-status" id="status-line">ready to start a work session?</div>

    <div class="badges">
      <div class="badge"><div class="num" id="work-clock">0:00</div><div class="lbl">work</div></div>
      <div class="badge"><div class="num" id="break-left">4h 0m</div><div class="lbl">break left</div></div>
    </div>

    <div class="controls" id="controls"></div>

    <div id="reason-box">
      <div class="rt" id="reason-text">why are you stopping early? 😤</div>
      <input type="text" id="reason-input" placeholder="give me a reason..." maxlength="120">
      <button class="btn btn-end" id="reason-submit">tell Mochi</button>
    </div>

    <div class="today-head">Today's list</div>
    <div class="today-progress empty-prog" id="today-progress"></div>
    <div id="today-items"><div class="empty">nothing yet — add something!</div></div>
    <div class="add-row">
      <input type="text" id="todo-input" placeholder="what do you want to finish?" maxlength="80">
      <button id="todo-add">+</button>
    </div>
  </div>

  <!-- Speech bubble -->
  <div id="speech-bubble"></div>

  <!-- Character -->
  <div id="character-wrap">
    <div id="task-badge">0</div>
    <img id="mochi-img" alt="">
    <svg id="mochi" class="mood-encouraging" viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
      <rect x="28" y="5" width="20" height="44" rx="10" fill="#f5e6e6" stroke="#444" stroke-width="2"/>
      <rect x="32" y="9" width="12" height="34" rx="6" fill="#ffb6c1"/>
      <rect x="72" y="5" width="20" height="44" rx="10" fill="#f5e6e6" stroke="#444" stroke-width="2"/>
      <rect x="76" y="9" width="12" height="34" rx="6" fill="#ffb6c1"/>
      <circle cx="60" cy="76" r="37" fill="#f5e6e6" stroke="#444" stroke-width="2"/>
      <ellipse cx="36" cy="80" rx="10" ry="7" fill="#ffb6c1" opacity="0.45"/>
      <ellipse cx="84" cy="80" rx="10" ry="7" fill="#ffb6c1" opacity="0.45"/>
      <g class="angry-brows">
        <line x1="40" y1="61" x2="52" y2="67" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="80" y1="61" x2="68" y2="67" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g class="eyes-open">
        <circle cx="47" cy="72" r="5.5" fill="#333"/>
        <circle cx="49.5" cy="69.5" r="2" fill="white"/>
        <circle cx="73" cy="72" r="5.5" fill="#333"/>
        <circle cx="75.5" cy="69.5" r="2" fill="white"/>
      </g>
      <g class="eyes-closed">
        <path d="M42,72 Q47,66 52,72" stroke="#444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M68,72 Q73,66 78,72" stroke="#444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
      <ellipse cx="60" cy="81" rx="4.5" ry="3" fill="#ffb6c1" stroke="#d9909a" stroke-width="1"/>
      <g class="mouth-smile">
        <path d="M51,88 Q60,95 69,88" stroke="#444" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
      <g class="mouth-sad">
        <path d="M51,93 Q60,87 69,93" stroke="#444" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <div id="distraction-timer">⏱ 0:00</div>
</div>

<script>
const mochiEl = document.getElementById('mochi')
const mochiImg = document.getElementById('mochi-img')
const bubble = document.getElementById('speech-bubble')
const timer = document.getElementById('distraction-timer')
const badge = document.getElementById('task-badge')
const charWrap = document.getElementById('character-wrap')
const panel = document.getElementById('panel')
const greetingEl = document.getElementById('greeting')
const statusLine = document.getElementById('status-line')
const workClockEl = document.getElementById('work-clock')
const breakLeftEl = document.getElementById('break-left')
const controlsEl = document.getElementById('controls')
const todayItemsEl = document.getElementById('today-items')
const todoInput = document.getElementById('todo-input')
const reasonBox = document.getElementById('reason-box')
const reasonInput = document.getElementById('reason-input')
const reasonText = document.getElementById('reason-text')

const MOODS = ['happy','focused','encouraging','sad','angry','nagging','sleeping']
let currentMood = 'encouraging'
let bubbleTimeout = null
let isDragging = false
let dragStart = {}
let lastStatus = { state: 'idle' }

// ── Custom sprite frames ──────────────────────────────────
// Moods with no frames of their own borrow another mood's frames
// (resolved recursively, so a chain like focused->happy->encouraging works).
const MOOD_FALLBACK = {
  happy: 'encouraging',
  focused: 'happy',
  angry: 'sad',
  nagging: 'angry',
  sleeping: 'sad',
  celebrate: 'happy'
}
// Per-mood frame duration (ms) when a mood is animated.
const FRAME_MS = { encouraging: 220, happy: 160, focused: 220, sad: 280, angry: 120, nagging: 140, sleeping: 360, celebrate: 130 }
// Gentle position animation for single-frame sprites.
const POS_ANIM = { happy:'anim-bounce', focused:'anim-float', encouraging:'anim-nod', sad:'anim-nod', angry:'anim-shake', nagging:'anim-shake', sleeping:'anim-float', celebrate:'anim-bounce' }

let spriteManifest = {}
let frameTimer = null

function framesFor(mood) {
  const seen = new Set()
  let m = mood
  while (m && !seen.has(m)) {
    if (spriteManifest[m] && spriteManifest[m].length) return spriteManifest[m]
    seen.add(m)
    m = MOOD_FALLBACK[m]
  }
  return null
}

function stopFrames() {
  if (frameTimer) { clearInterval(frameTimer); frameTimer = null }
}

// Show a mood as a single static pose (frame 0) with a gentle position bob.
// Frames never loop on their own — the ear flop is a one-shot (see playFlop).
function showStatic(mood, frames) {
  stopFrames()
  mochiImg.className = ''
  mochiImg.src = frames[0]
  const a = POS_ANIM[mood]
  if (a) mochiImg.classList.add(a)
}

function setMood(mood) {
  currentMood = mood
  const frames = framesFor(mood)
  if (frames) {
    charWrap.classList.add('has-frames')
    showStatic(mood, frames)
  } else {
    // Fallback: built-in SVG bunny
    charWrap.classList.remove('has-frames')
    stopFrames()
    const svgMood = MOODS.includes(mood) ? mood : 'happy'
    MOODS.forEach(m => mochiEl.classList.remove('mood-' + m))
    mochiEl.classList.add('mood-' + svgMood)
  }
  if (mood !== 'sad' && mood !== 'angry') timer.classList.remove('visible')
}

// One-shot ear flop (both-up → flop → both-flopped → flop → both-up).
// Only triggered by a click or Ctrl+M show, and only while she's in a calm pose.
const FLOP_MS = 240
function playFlop() {
  const flop = spriteManifest['encouraging']
  if (!flop || flop.length < 2) return
  if (framesFor(currentMood) !== flop) return  // skip when sad/angry/celebrating
  stopFrames()
  const order = flop.map((_, i) => i)
  const seq = order.concat(order.slice(0, -1).reverse()) // out and back
  let i = 0
  mochiImg.className = ''
  mochiImg.src = flop[0]
  frameTimer = setInterval(() => {
    i++
    if (i >= seq.length) { stopFrames(); mochiImg.src = flop[0]; return }
    mochiImg.src = flop[seq[i]]
  }, FLOP_MS)
}

function showBubble(text, ms = 4500) {
  if (!text) return
  if (bubbleTimeout) clearTimeout(bubbleTimeout)
  bubble.textContent = text
  bubble.classList.add('visible')
  bubbleTimeout = setTimeout(() => bubble.classList.remove('visible'), ms)
}

function openPanel() { panel.classList.add('open') }
function closePanel() { panel.classList.remove('open') }
function togglePanel() { panel.classList.toggle('open') }

function fmtClock(ms) {
  const totalSec = Math.floor(ms / 1000)
  const h = Math.floor(totalSec / 3600)
  const m = Math.floor((totalSec % 3600) / 60)
  const s = totalSec % 60
  if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0')
  return m + ':' + String(s).padStart(2,'0')
}
function fmtMin(min) {
  const h = Math.floor(min / 60)
  const m = Math.round(min % 60)
  return h > 0 ? h + 'h ' + m + 'm' : m + 'm'
}

function renderControls(status) {
  const s = status.state
  if (s === 'idle') {
    controlsEl.innerHTML = '<button class="btn btn-work" id="c-start">▶ Start Work</button>'
    document.getElementById('c-start').onclick = () => window.mochi.startWork()
  } else if (s === 'working') {
    const disabled = status.breakAllowed ? '' : 'disabled'
    controlsEl.innerHTML =
      '<button class="btn btn-break" id="c-break" ' + disabled + '>☕ Break</button>' +
      '<button class="btn btn-end" id="c-end">⏹ End Work</button>'
    const b = document.getElementById('c-break')
    if (b && status.breakAllowed) b.onclick = () => window.mochi.takeBreak()
    document.getElementById('c-end').onclick = () => window.mochi.endWork()
  } else if (s === 'break') {
    controlsEl.innerHTML =
      '<button class="btn btn-back" id="c-back">▶ Back to Work</button>' +
      '<button class="btn btn-end" id="c-end">⏹ End Work</button>'
    document.getElementById('c-back').onclick = () => window.mochi.startWork()
    document.getElementById('c-end').onclick = () => window.mochi.endWork()
  }
}

function renderStatus(status) {
  lastStatus = status
  // Cumulative work time for the day (keeps counting across breaks; frozen during a break).
  workClockEl.textContent = fmtClock(status.workTodayMs || 0)
  breakLeftEl.textContent = fmtMin(status.breakRemainingMin)

  if (status.state === 'idle') {
    statusLine.textContent = 'ready to start a work session?'
  } else if (status.state === 'working') {
    statusLine.textContent = status.breakAllowed ? "you're in work mode — lock in 💪" : "no breaks left — keep going!"
  } else if (status.state === 'break') {
    statusLine.textContent = 'on a break ☕ enjoy (then come back!)'
  }
  renderControls(status)
}

function renderToday(items) {
  items = items || []

  // Segmented completion progress (one segment per item, filled when done).
  const prog = document.getElementById('today-progress')
  if (prog) {
    if (items.length === 0) {
      prog.className = 'today-progress empty-prog'
      prog.innerHTML = ''
    } else {
      const done = items.filter(i => i.done).length
      let segs = ''
      for (let i = 0; i < items.length; i++) segs += '<span class="seg' + (items[i].done ? ' done' : '') + '"></span>'
      prog.className = 'today-progress'
      prog.innerHTML = '<div class="pbar">' + segs + '</div><div class="plabel">' + done + ' of ' + items.length + ' done</div>'
    }
  }

  if (items.length === 0) {
    todayItemsEl.innerHTML = '<div class="empty">nothing yet — add something!</div>'
    return
  }

  const ACC = ['acc-red', 'acc-amber', 'acc-green']
  todayItemsEl.innerHTML = items.map((it, i) =>
    '<div class="todo ' + ACC[i % 3] + (it.done ? ' done' : '') + '" data-id="' + it.id + '">' +
      '<div class="box">' + (it.done ? '✓' : '') + '</div>' +
      '<div class="txt">' + escapeHtml(it.text) + '</div>' +
      '<div class="del">×</div>' +
    '</div>'
  ).join('')

  todayItemsEl.querySelectorAll('.todo').forEach(row => {
    const id = Number(row.dataset.id)
    row.querySelector('.box').onclick = () => window.mochi.toggleTodo(id)
    row.querySelector('.del').onclick = () => window.mochi.removeTodo(id)
  })
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
}

// ── Add todo ──
function addTodo() {
  const v = todoInput.value.trim()
  if (!v) return
  window.mochi.addTodo(v)
  todoInput.value = ''
}
document.getElementById('todo-add').onclick = addTodo
todoInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo() })

// ── End-Work reason prompt ──
function submitReason() {
  const v = reasonInput.value.trim()
  if (!v) return
  window.mochi.submitReason(v)
  reasonInput.value = ''
  reasonBox.classList.remove('show')
}
document.getElementById('reason-submit').onclick = submitReason
reasonInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitReason() })

// ── IPC from main ──
window.mochi.onMoodChanged(data => setMood(data.mood || data))
window.mochi.onQuoteShow(text => showBubble(text))
window.mochi.onTaskNagging(name => showBubble('⚠ "' + name + '" is overdue!', 6000))
window.mochi.onSessionStatus(status => renderStatus(status))
window.mochi.onTodayList(items => renderToday(items))
window.mochi.onTogglePanel(() => togglePanel())
window.mochi.onOpenPanel(() => openPanel())
window.mochi.onSpriteManifest(manifest => {
  spriteManifest = manifest || {}
  setMood(currentMood)
  setTimeout(playFlop, 700) // greeting flop once frames are loaded
})
window.mochi.onPlayFlop(() => playFlop()) // Ctrl+M called her back up
window.mochi.onAskReason(items => {
  const n = (items || []).length
  reasonText.textContent = `you left ${n} thing${n > 1 ? 's' : ''} undone 😤 why?`
  reasonBox.classList.add('show')
  openPanel()
  reasonInput.focus()
})

window.mochi.onDistractionTimer(seconds => {
  if (seconds <= 0) { timer.classList.remove('visible'); return }
  const m = Math.floor(seconds / 60), s = seconds % 60
  timer.textContent = '⏱ ' + m + ':' + String(s).padStart(2,'0') + ' wasted'
  timer.classList.add('visible')
})

window.mochi.onTaskBadgeUpdate(count => {
  if (count > 0) { badge.textContent = count > 9 ? '9+' : count; badge.classList.add('visible') }
  else badge.classList.remove('visible')
})

// ── Character click → flop ears + toggle panel ──
charWrap.addEventListener('click', () => {
  if (isDragging) return
  playFlop()
  togglePanel()
})

// ── Dragging Mochi ──
charWrap.addEventListener('mousedown', e => {
  if (e.button !== 0) return
  isDragging = false
  dragStart = { x: e.screenX, y: e.screenY, wx: window.screenX, wy: window.screenY }
})
let lastIgnore = null
document.addEventListener('mousemove', e => {
  // Toggle click-through: solid only over Mochi or the open panel.
  // Only send the IPC when the value actually changes (avoids per-move spam).
  const el = document.elementFromPoint(e.clientX, e.clientY)
  const overChar = charWrap.contains(el)
  const overPanel = panel.classList.contains('open') && panel.contains(el)
  const ignore = !(overChar || overPanel)
  if (ignore !== lastIgnore) {
    lastIgnore = ignore
    window.mochi.setIgnoreMouseEvents(ignore)
  }

  if (e.buttons === 1 && dragStart.x !== undefined) {
    const dx = e.screenX - dragStart.x, dy = e.screenY - dragStart.y
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
      isDragging = true
      window.moveTo(dragStart.wx + dx, dragStart.wy + dy)
    }
  }
})
document.addEventListener('mouseup', () => setTimeout(() => { isDragging = false }, 50))

// Surface any renderer error to the main log
window.addEventListener('error', e => console.log('RENDERER ERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno))

// Ask main for initial state
window.mochi.requestInit()
</script>
</body>
