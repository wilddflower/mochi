<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 320px;
    height: 520px;
    background: transparent;
    overflow: hidden;
    user-select: none;
    font-family: 'Segoe UI', sans-serif;
  }

  #container {
    width: 320px;
    height: 520px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 2px;
  }

  /* ── Pop-out panel ───────────────────────────────────── */
  #panel {
    position: absolute;
    bottom: 132px;
    right: 8px;
    width: 270px;
    max-height: 360px;
    background: #fffdfb;
    border: 2px solid #e8b4c0;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(180, 100, 130, 0.28);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
    transform: translateY(12px) scale(0.97);
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
    z-index: 20;
  }
  #panel.open {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .panel-greeting { font-size: 15px; font-weight: 700; color: #b0436a; }
  .panel-status   { font-size: 12px; color: #8a6b75; margin-top: -4px; }

  /* Clock + break badges */
  .badges { display: flex; gap: 8px; }
  .badge {
    flex: 1; text-align: center; padding: 6px 4px;
    border-radius: 8px; background: #fdeef2; border: 1px solid #f3d6de;
  }
  .badge .num { font-size: 16px; font-weight: 700; color: #b0436a; }
  .badge .lbl { font-size: 9px; color: #a98a93; text-transform: uppercase; letter-spacing: 0.4px; }

  /* Controls */
  .controls { display: flex; gap: 6px; }
  .btn {
    flex: 1; padding: 9px 6px; border: none; border-radius: 9px;
    font-size: 12px; font-weight: 700; cursor: pointer; transition: filter 0.15s;
  }
  .btn:hover { filter: brightness(0.95); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
  .btn-work  { background: #6ec18a; color: #fff; }
  .btn-break { background: #f2c14e; color: #6b4e00; }
  .btn-back  { background: #6ec18a; color: #fff; }

  /* Today list */
  .today-head { font-size: 11px; font-weight: 700; color: #a98a93;
                text-transform: uppercase; letter-spacing: 0.5px; }
  #today-items { display: flex; flex-direction: column; gap: 4px;
                 overflow-y: auto; max-height: 150px; }
  #today-items::-webkit-scrollbar { width: 5px; }
  #today-items::-webkit-scrollbar-thumb { background: #e8b4c0; border-radius: 3px; }

  .todo {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 8px; background: #fbf3f6;
    font-size: 13px; color: #4a3a40;
  }
  .todo .box {
    width: 17px; height: 17px; border-radius: 5px; border: 2px solid #e0a8b6;
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 12px; color: #fff; background: #fff;
  }
  .todo.done .box { background: #6ec18a; border-color: #6ec18a; }
  .todo.done .txt { text-decoration: line-through; color: #b3a3a9; }
  .todo .txt { flex: 1; word-break: break-word; }
  .todo .del { cursor: pointer; color: #d8b8c0; font-size: 15px; line-height: 1; }
  .todo .del:hover { color: #e07a90; }

  .add-row { display: flex; gap: 6px; }
  .add-row input {
    flex: 1; border: 1px solid #f0cdd7; border-radius: 8px;
    padding: 7px 9px; font-size: 12px; outline: none; background: #fff;
  }
  .add-row input:focus { border-color: #e0a8b6; }
  .add-row button {
    border: none; background: #e8b4c0; color: #fff; border-radius: 8px;
    padding: 0 12px; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .empty { font-size: 12px; color: #c0a8b0; font-style: italic; text-align: center; padding: 6px; }

  /* Panel tail pointing to Mochi */
  #panel::after {
    content: ''; position: absolute; bottom: -9px; right: 44px;
    width: 0; height: 0; border-left: 9px solid transparent;
    border-right: 9px solid transparent; border-top: 9px solid #fffdfb;
  }
  #panel::before {
    content: ''; position: absolute; bottom: -12px; right: 43px;
    width: 0; height: 0; border-left: 10px solid transparent;
    border-right: 10px solid transparent; border-top: 10px solid #e8b4c0;
  }

  /* ── Speech bubble ───────────────────────────────────── */
  #speech-bubble {
    display: none;
    position: absolute;
    bottom: 128px;
    right: 8px;
    max-width: 220px;
    background: #fffdf0;
    border: 2px solid #b0436a;
    border-radius: 10px;
    padding: 7px 11px;
    font-size: 12px;
    line-height: 1.4;
    color: #5a2a3a;
    text-align: center;
    box-shadow: 2px 2px 0 #b0436a;
    z-index: 15;
    word-break: break-word;
  }
  #speech-bubble::after {
    content: ''; position: absolute; bottom: -8px; right: 40px;
    width: 0; height: 0; border-left: 6px solid transparent;
    border-right: 6px solid transparent; border-top: 8px solid #b0436a;
  }
  #speech-bubble.visible { display: block; }

  /* ── Character (Mochi) ───────────────────────────────── */
  #character-wrap {
    position: relative; width: 120px; height: 120px;
    cursor: pointer; flex-shrink: 0; align-self: flex-end; margin-right: 14px;
  }
  #mochi { width: 120px; height: 120px; display: block; }

  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes shake  { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  @keyframes pulse  { 0%,100%{opacity:1} 50%{opacity:0.8} }
  @keyframes nod    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  @keyframes zzz    { 0%,100%{opacity:0.65} 50%{opacity:1} }

  #mochi.mood-happy       { animation: bounce 0.8s ease-in-out infinite; }
  #mochi.mood-focused     { animation: pulse  2s ease-in-out infinite; }
  #mochi.mood-encouraging { animation: nod    1.2s ease-in-out infinite; }
  #mochi.mood-sad         { filter: brightness(0.82) saturate(0.55); }
  #mochi.mood-angry       { animation: shake  0.4s linear infinite; filter: hue-rotate(340deg) saturate(1.4); }
  #mochi.mood-nagging     { animation: bounce 0.45s ease-in-out infinite; filter: hue-rotate(280deg); }
  #mochi.mood-sleeping    { animation: zzz    2s ease-in-out infinite; filter: grayscale(0.35); }

  #mochi .angry-brows { display: none; }
  #mochi .eyes-closed { display: none; }
  #mochi .mouth-sad   { display: none; }
  #mochi.mood-sleeping .eyes-open   { display: none; }
  #mochi.mood-sleeping .eyes-closed { display: block; }
  #mochi.mood-sad .mouth-smile { display: none; }
  #mochi.mood-sad .mouth-sad   { display: block; }
  #mochi.mood-angry  .angry-brows { display: block; }
  #mochi.mood-nagging .angry-brows { display: block; opacity: 0.65; }

  #task-badge {
    display: none; position: absolute; top: 2px; right: 2px;
    background: #e74c3c; color: white; font-size: 9px; font-weight: bold;
    width: 18px; height: 18px; border-radius: 50%;
    align-items: center; justify-content: center; border: 1.5px solid #fff; z-index: 5;
  }
  #task-badge.visible { display: flex; }

  #distraction-timer {
    display: none; font-size: 10px; color: #fff; background: rgba(231,76,60,0.92);
    border-radius: 10px; padding: 2px 8px; margin-top: 2px; margin-right: 14px;
    letter-spacing: 0.5px; height: 18px; align-items: center; align-self: flex-end;
  }
  #distraction-timer.visible { display: flex; }
</style>
</head>
<body>
<div id="container">

  <!-- Pop-out panel -->
  <div id="panel">
    <div class="panel-greeting" id="greeting">hi pavni 🐰</div>
    <div class="panel-status" id="status-line">ready to start a work session?</div>

    <div class="badges">
      <div class="badge"><div class="num" id="work-clock">0:00</div><div class="lbl">work</div></div>
      <div class="badge"><div class="num" id="break-left">4h 0m</div><div class="lbl">break left</div></div>
    </div>

    <div class="controls" id="controls"></div>

    <div class="today-head">Today's list</div>
    <div id="today-items"><div class="empty">nothing yet — add something!</div></div>
    <div class="add-row">
      <input type="text" id="todo-input" placeholder="what do you want to finish?" maxlength="80">
      <button id="todo-add">+</button>
    </div>
  </div>

  <!-- Speech bubble -->
  <div id="speech-bubble"></div>

  <!-- Character -->
  <div id="character-wrap">
    <div id="task-badge">0</div>
    <svg id="mochi" class="mood-encouraging" viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
      <rect x="28" y="5" width="20" height="44" rx="10" fill="#f5e6e6" stroke="#444" stroke-width="2"/>
      <rect x="32" y="9" width="12" height="34" rx="6" fill="#ffb6c1"/>
      <rect x="72" y="5" width="20" height="44" rx="10" fill="#f5e6e6" stroke="#444" stroke-width="2"/>
      <rect x="76" y="9" width="12" height="34" rx="6" fill="#ffb6c1"/>
      <circle cx="60" cy="76" r="37" fill="#f5e6e6" stroke="#444" stroke-width="2"/>
      <ellipse cx="36" cy="80" rx="10" ry="7" fill="#ffb6c1" opacity="0.45"/>
      <ellipse cx="84" cy="80" rx="10" ry="7" fill="#ffb6c1" opacity="0.45"/>
      <g class="angry-brows">
        <line x1="40" y1="61" x2="52" y2="67" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="80" y1="61" x2="68" y2="67" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g class="eyes-open">
        <circle cx="47" cy="72" r="5.5" fill="#333"/>
        <circle cx="49.5" cy="69.5" r="2" fill="white"/>
        <circle cx="73" cy="72" r="5.5" fill="#333"/>
        <circle cx="75.5" cy="69.5" r="2" fill="white"/>
      </g>
      <g class="eyes-closed">
        <path d="M42,72 Q47,66 52,72" stroke="#444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M68,72 Q73,66 78,72" stroke="#444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
      <ellipse cx="60" cy="81" rx="4.5" ry="3" fill="#ffb6c1" stroke="#d9909a" stroke-width="1"/>
      <g class="mouth-smile">
        <path d="M51,88 Q60,95 69,88" stroke="#444" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
      <g class="mouth-sad">
        <path d="M51,93 Q60,87 69,93" stroke="#444" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <div id="distraction-timer">⏱ 0:00</div>
</div>

<script>
const mochiEl = document.getElementById('mochi')
const bubble = document.getElementById('speech-bubble')
const timer = document.getElementById('distraction-timer')
const badge = document.getElementById('task-badge')
const charWrap = document.getElementById('character-wrap')
const panel = document.getElementById('panel')
const greetingEl = document.getElementById('greeting')
const statusLine = document.getElementById('status-line')
const workClockEl = document.getElementById('work-clock')
const breakLeftEl = document.getElementById('break-left')
const controlsEl = document.getElementById('controls')
const todayItemsEl = document.getElementById('today-items')
const todoInput = document.getElementById('todo-input')

const MOODS = ['happy','focused','encouraging','sad','angry','nagging','sleeping']
let currentMood = 'encouraging'
let bubbleTimeout = null
let isDragging = false
let dragStart = {}
let lastStatus = { state: 'idle' }

function setMood(mood) {
  currentMood = mood
  MOODS.forEach(m => mochiEl.classList.remove('mood-' + m))
  mochiEl.classList.add('mood-' + mood)
  if (mood !== 'sad' && mood !== 'angry') timer.classList.remove('visible')
}

function showBubble(text, ms = 4500) {
  if (!text) return
  if (bubbleTimeout) clearTimeout(bubbleTimeout)
  bubble.textContent = text
  bubble.classList.add('visible')
  bubbleTimeout = setTimeout(() => bubble.classList.remove('visible'), ms)
}

function openPanel() { panel.classList.add('open') }
function closePanel() { panel.classList.remove('open') }
function togglePanel() { panel.classList.toggle('open') }

function fmtClock(ms) {
  const totalSec = Math.floor(ms / 1000)
  const h = Math.floor(totalSec / 3600)
  const m = Math.floor((totalSec % 3600) / 60)
  const s = totalSec % 60
  if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0')
  return m + ':' + String(s).padStart(2,'0')
}
function fmtMin(min) {
  const h = Math.floor(min / 60)
  const m = Math.round(min % 60)
  return h > 0 ? h + 'h ' + m + 'm' : m + 'm'
}

function renderControls(status) {
  const s = status.state
  if (s === 'idle') {
    controlsEl.innerHTML = '<button class="btn btn-work" id="c-start">▶ Start Work</button>'
    document.getElementById('c-start').onclick = () => window.mochi.startWork()
  } else if (s === 'working') {
    const disabled = status.breakAllowed ? '' : 'disabled'
    controlsEl.innerHTML =
      '<button class="btn btn-break" id="c-break" ' + disabled + '>☕ Take a Break</button>'
    const b = document.getElementById('c-break')
    if (b && status.breakAllowed) b.onclick = () => window.mochi.takeBreak()
  } else if (s === 'break') {
    controlsEl.innerHTML = '<button class="btn btn-back" id="c-back">▶ Back to Work</button>'
    document.getElementById('c-back').onclick = () => window.mochi.startWork()
  }
}

function renderStatus(status) {
  lastStatus = status
  workClockEl.textContent = status.state === 'working' ? fmtClock(status.workElapsedMs) : '—'
  breakLeftEl.textContent = fmtMin(status.breakRemainingMin)

  if (status.state === 'idle') {
    statusLine.textContent = 'ready to start a work session?'
  } else if (status.state === 'working') {
    statusLine.textContent = status.breakAllowed ? "you're in work mode — lock in 💪" : "no breaks left — keep going!"
  } else if (status.state === 'break') {
    statusLine.textContent = 'on a break ☕ enjoy (then come back!)'
  }
  renderControls(status)
}

function renderToday(items) {
  if (!items || items.length === 0) {
    todayItemsEl.innerHTML = '<div class="empty">nothing yet — add something!</div>'
    return
  }
  todayItemsEl.innerHTML = items.map(it =>
    '<div class="todo ' + (it.done ? 'done' : '') + '" data-id="' + it.id + '">' +
      '<div class="box">' + (it.done ? '✓' : '') + '</div>' +
      '<div class="txt">' + escapeHtml(it.text) + '</div>' +
      '<div class="del">×</div>' +
    '</div>'
  ).join('')

  todayItemsEl.querySelectorAll('.todo').forEach(row => {
    const id = Number(row.dataset.id)
    row.querySelector('.box').onclick = () => window.mochi.toggleTodo(id)
    row.querySelector('.del').onclick = () => window.mochi.removeTodo(id)
  })
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
}

// ── Add todo ──
function addTodo() {
  const v = todoInput.value.trim()
  if (!v) return
  window.mochi.addTodo(v)
  todoInput.value = ''
}
document.getElementById('todo-add').onclick = addTodo
todoInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo() })

// ── IPC from main ──
window.mochi.onMoodChanged(data => setMood(data.mood || data))
window.mochi.onQuoteShow(text => showBubble(text))
window.mochi.onTaskNagging(name => showBubble('⚠ "' + name + '" is overdue!', 6000))
window.mochi.onSessionStatus(status => renderStatus(status))
window.mochi.onTodayList(items => renderToday(items))
window.mochi.onTogglePanel(() => togglePanel())
window.mochi.onOpenPanel(() => openPanel())

window.mochi.onDistractionTimer(seconds => {
  if (seconds <= 0) { timer.classList.remove('visible'); return }
  const m = Math.floor(seconds / 60), s = seconds % 60
  timer.textContent = '⏱ ' + m + ':' + String(s).padStart(2,'0') + ' wasted'
  timer.classList.add('visible')
})

window.mochi.onTaskBadgeUpdate(count => {
  if (count > 0) { badge.textContent = count > 9 ? '9+' : count; badge.classList.add('visible') }
  else badge.classList.remove('visible')
})

// ── Character click → toggle panel ──
charWrap.addEventListener('click', () => { if (!isDragging) togglePanel() })

// ── Dragging Mochi ──
charWrap.addEventListener('mousedown', e => {
  if (e.button !== 0) return
  isDragging = false
  dragStart = { x: e.screenX, y: e.screenY, wx: window.screenX, wy: window.screenY }
})
document.addEventListener('mousemove', e => {
  // Toggle click-through: solid only over Mochi or the open panel
  const el = document.elementFromPoint(e.clientX, e.clientY)
  const overChar = charWrap.contains(el)
  const overPanel = panel.classList.contains('open') && panel.contains(el)
  window.mochi.setIgnoreMouseEvents(!(overChar || overPanel))

  if (e.buttons === 1 && dragStart.x !== undefined) {
    const dx = e.screenX - dragStart.x, dy = e.screenY - dragStart.y
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
      isDragging = true
      window.moveTo(dragStart.wx + dx, dragStart.wy + dy)
    }
  }
})
document.addEventListener('mouseup', () => setTimeout(() => { isDragging = false }, 50))

// Surface any renderer error to the main log
window.addEventListener('error', e => console.log('RENDERER ERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno))

// Ask main for initial state
window.mochi.requestInit()
</script>
</body>
</html>
